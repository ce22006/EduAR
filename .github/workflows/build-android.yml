name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  buildForAndroid:
    name: Build for Android  
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-2022.3.21f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-2022.3.21f1-
            Library-Android-

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 2022.3.21f1
          buildMethod: BuildScript.PerformAndroidBuild
          buildsPath: builds
          androidKeystoreName: user.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          allowDirtyBuild: true

      - name: List build output
        if: always()
        run: |
          echo "=== Build directory contents ==="
          ls -lah builds/ || echo "builds/ directory not found"
          ls -lah builds/Android/ || echo "builds/Android/ directory not found"
          find builds -type f -name "*.apk" -o -name "*.log" || echo "No APK or log files found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: EduAR-APK
          path: builds/Android/*.apk
          retention-days: 14
