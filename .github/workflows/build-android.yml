name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  buildForAndroid:
    name: Build for Android  
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-2022.3.21f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-2022.3.21f1-
            Library-Android-

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Build Android
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 2022.3.21f1
          buildName: EduAR
          buildsPath: builds
          androidKeystoreName: user.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      # Collect Unity Editor log for debugging (upload even on failure)
      - name: Collect Unity Editor log
        if: always()
        run: |
          echo "Looking for Unity Editor logs..."
          # Common Editor log locations
          LOG_PATHS=("$HOME/.config/unity3d/Editor.log" "/home/runner/.config/unity3d/Editor.log" "$RUNNER_TEMP/Editor.log" "/root/.config/unity3d/Editor.log")
          FOUND=0
          for p in "${LOG_PATHS[@]}"; do
            if [ -f "$p" ]; then
              echo "Found log: $p"
              mkdir -p build-logs
              cp "$p" build-logs/Editor.log
              FOUND=1
              break
            fi
          done
          if [ $FOUND -eq 0 ]; then
            echo "No Editor.log found in common locations. Dumping possible Unity temp files:" || true
            ls -la $RUNNER_TEMP || true
            # create an empty placeholder so upload step has something
            mkdir -p build-logs
            echo "No Editor.log found" > build-logs/Editor.log
          fi

      - name: Upload Build and Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EduAR-Android-and-Logs
          path: |
            builds/Android
            build-logs/Editor.log
          retention-days: 14
